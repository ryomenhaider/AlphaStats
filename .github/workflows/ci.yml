name: CI pipeline

on:
    push:
        branches:
            - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check code formatting
        run: uv run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Pyright / Mypy type-checking
        run: uv run mypy . || uv run pyright .

  unit-tests:
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Unit Tests
        run: uv run pytest test/

  pr_req:
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request using GitHub CLI
        # The env block authenticates the pre-installed 'gh' CLI in GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates a PR into main; --fill uses the last commit message for title/body
        run: |
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "Automated PR: ${{ github.event.head_commit.message }}" \
            --body "This PR was automatically generated by the CI pipeline after successful checks." \
            || echo "PR already exists or could not be created."